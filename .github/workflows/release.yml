name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          if ! .github/scripts/extract-changelog.sh "${{ steps.version.outputs.version }}" > "$BODY_FILE"; then
            echo "Failed to extract changelog" >&2
            exit 1
          fi
          if [[ ! -s "$BODY_FILE" ]]; then
            echo "No changelog entry for version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .github/flutter-version / ci.yml / pubspec.lock.
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Configure Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/configure-android-signing.sh

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build IzzyOnDroid APK (cloud AI + Agents UI off)
        run: |
          flutter build apk --release \
            --dart-define=CLOUD_AI=false \
            --dart-define=AGENTS=false
          cp build/app/outputs/flutter-apk/app-release.apk \
            "PocketShell-v${{ steps.version.outputs.version }}-izzy.apk"

      - name: Build release APK (cloud AI on — F-Droid / sideload)
        run: flutter build apk --release

      - name: Build F-Droid arm64 split APK
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      # Prepare named APKs before ABI verify so a verify failure still leaves
      # downloadable workflow artifacts (v1.4.2 lost APKs when aapt parse failed).
      - name: Prepare APK artifacts
        id: apks
        run: |
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_DST="PocketShell-v${{ steps.version.outputs.version }}.apk"
          IZZY_DST="PocketShell-v${{ steps.version.outputs.version }}-izzy.apk"
          cp "$APK_SRC" "$APK_DST"
          if [[ ! -f "$IZZY_DST" ]]; then
            echo "Missing Izzy APK at $IZZY_DST" >&2
            exit 1
          fi
          if [[ "${{ steps.signing.outputs.signed }}" != "true" ]]; then
            echo "::warning::GitHub Release APKs are debug-signed. Add ANDROID_KEYSTORE_* secrets for IzzyOnDroid / sideload. F-Droid is unaffected."
            printf '\n\n_GitHub APKs are debug-signed until ANDROID_KEYSTORE_* secrets are set. F-Droid rebuilds and signs with its own key. The `-izzy` APK uses `CLOUD_AI=false` + `AGENTS=false` (no cloud wand / Agents tab)._\n' >> "${{ steps.changelog.outputs.path }}"
          else
            printf '\n\n_Artifacts: default APK includes optional cloud AI wand (NonFreeNet) and Agents. `*-izzy.apk` uses `CLOUD_AI=false` + `AGENTS=false` for IzzyOnDroid._\n' >> "${{ steps.changelog.outputs.path }}"
          fi

      - name: Retain APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketShell-v${{ steps.version.outputs.version }}-apks
          path: |
            PocketShell-v${{ steps.version.outputs.version }}.apk
            PocketShell-v${{ steps.version.outputs.version }}-izzy.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify F-Droid ABI versionCode
        run: bash .github/scripts/verify-split-apk-versioncode.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: PocketShell v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            PocketShell-v${{ steps.version.outputs.version }}.apk
            PocketShell-v${{ steps.version.outputs.version }}-izzy.apk
          draft: false
          prerelease: false
          generate_release_notes: false
