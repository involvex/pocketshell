name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      # No JDK here: analyze/test never invoke Gradle, and setup-java's
      # cache: gradle warns when ~/.gradle does not exist at job end.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2 # v2.20.0
        with:
          # Single source of truth: .github/flutter-version (keep in sync
          # with local SDK / pubspec.lock Dart constraints).
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '.github/flutter-version') }}

      - name: Confirm Flutter pin
        run: |
          expected="${{ steps.flutter-ver.outputs.version }}"
          actual="$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')"
          echo "Pinned Flutter: $expected"
          echo "Installed Flutter: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Flutter $actual does not match .github/flutter-version ($expected)"
            exit 1
          fi
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2 # v4.6.0
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build_android:
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2 # v2.20.0
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '.github/flutter-version') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2 # v4.6.0
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
