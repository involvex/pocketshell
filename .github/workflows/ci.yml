name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2 # v2.20.0
        with:
          # Pin with pubspec.lock / local SDK. Floating stable (3.47+)
          # needs intl ^0.20.3 and material_ui 1.4+ (Dart ^3.13).
          flutter-version: "3.44.4"
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2 # v4.6.0
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build_android:
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2 # v2.20.0
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2 # v4.6.0
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
