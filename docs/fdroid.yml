# Draft F-Droid metadata for gitlab.com/fdroid/fdroiddata (RFP).
# Not consumed by this repo's CI.
#
# v1.4.1 does **not** include Fastlane/screenshots. File the RFP against
# v1.4.2 (or newer than v1.4.1). Flutter pin: .github/flutter-version
# and pubspec environment.flutter.
#
# ABI split: android/app/build.gradle.kts sets
# versionCode * 10 + {armeabi-v7a=1, arm64-v8a=2, x86_64=3}. pubspec
# 1.4.2+16 therefore ships as 161 / 162 / 163.

Categories:
