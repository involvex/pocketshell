MaintainerNotes: |
  First listing tag is v1.4.2 (newer than v1.4.1, which has no Fastlane).
  Build these APKs from commit v1.4.2 even if main is ahead.
  Flutter SDK pin is `.github/flutter-version`
  (3.47.9, tag on flutter/flutter) and pubspec `environment.flutter`.
  On v1.4.2 the wrapper is Gradle 9.8.2-all.zip; prebuild sets distributionSha256Sum
  (sha256 a1bb7e9651ef09e4cd9a62d471564e0ee23b5757e5f21fd7358d7cfc21018fdf)
  with AGP 9.5.1. Later main may use Gradle 9.9.2 / AGP 9.5.2; both
  Gradle zips are in gradle-transparency-log
  (9.9.2-all sha256 1ac85e9cbc2b091ad04e6c6d0f486f0a2a2fabd78f9f8719a0d5bcc0ce1b345b).
  Prebuild strips foojay-resolver and enables R8 minify, excludes com.google.android.play (Flutter deferred-components Play Core), then lowers the Flutter template heap and turns off the Gradle
  daemon/parallel flags so the buildserver does not OOM. ABI split uses
  versionCode*10+ABI (see android/app/build.gradle.kts). Vendored
  `packages/home_widget` is BSD-3 (AGP 9 Kotlin plugin patch; see
  packages/home_widget/PATCH.md). Nested plugin Gradle wrapper is
  removed from the tree. Bundled fonts are OFL (`assets/fonts/OFL.txt`).
  Optional AI wand is NonFreeNet. Cold start / splash do not open
  opencode.ai or api.kilo.ai; empty API key fails before Dio.
  Privacy policy is PRIVACY.md
  (https://github.com/involvex/pocketshell/blob/HEAD/PRIVACY.md).
  android:allowBackup=false; backup/data-extraction rules exclude
  SharedPreferences (incl. FlutterSecureStorage).
  RFP: https://gitlab.com/fdroid/rfp/-/work_items/4880
  ndk 28.2.13676358 is Flutter 3.47.9's flutter.ndkVersion; bump it
  when .github/flutter-version moves. Local split APKs pass
  `zipalign -c -P 16` and 64-bit .so LOAD p_align is 16KiB or 64KiB.
  Local R8 arm64 release APK dex has no com.google.android.play / gms /
  firebase strings (fork CI check apk also clean).

