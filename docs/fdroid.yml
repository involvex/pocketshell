AntiFeatures:
  NonFreeNet:
    en-US: Optional terminal AI wand calls opencode.ai and api.kilo.ai only when the
      user pastes an API key and taps generate. Self-hosted OpenCode on the SSH profile
      is not NonFreeNet.
Categories:
  - Connectivity
  - Internet
  - Remote Access
  - Security
License: MIT
AuthorName: involvex
WebSite: https://github.com/involvex/pocketshell
SourceCode: https://github.com/involvex/pocketshell
IssueTracker: https://github.com/involvex/pocketshell/issues
Changelog: https://github.com/involvex/pocketshell/blob/HEAD/CHANGELOG.md

Name: PocketShell
AutoName: PocketShell

RepoType: git
Repo: https://github.com/involvex/pocketshell.git

Builds:
  - versionName: 1.4.2
    versionCode: 161
    commit: v1.4.2
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - ios
      - macos
      - windows
      - linux
      - web
      - packages/home_widget/ios
    prebuild:
      - flutterVersion=$(tr -d '[:space:]' < .github/flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i 
        's/-Xmx8G/-Xmx2G/;s/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=512m/;s/org.gradle.daemon=true/org.gradle.daemon=false/;s/org.gradle.parallel=true/org.gradle.parallel=false/'
        android/gradle.properties
      - sed -i '/foojay-resolver/d' android/settings.gradle.kts
      - sed -i 
        '$a\distributionSha256Sum=a1bb7e9651ef09e4cd9a62d471564e0ee23b5757e5f21fd7358d7cfc21018fdf'
        android/gradle/wrapper/gradle-wrapper.properties
      - sed -i -e 's/isMinifyEnabled = false/isMinifyEnabled = true/' -e 's/isShrinkResources
        = false/isShrinkResources = true/' android/app/build.gradle.kts
      - printf '%s\n' '-dontwarn com.google.android.play.**' > android/app/proguard-rules.pro
      - sed -i '/isShrinkResources = true/a\            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),
        "proguard-rules.pro")' android/app/build.gradle.kts
      - sed -i -e '$a\' -e 'configurations.configureEach { exclude(group = "com.google.android.play")
        }' android/app/build.gradle.kts
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter --version
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_HOME=$$NDK$$
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
    ndk: 28.2.13676358

