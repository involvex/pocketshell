name: ssh_app
description: PocketShell — SSH, SFTP, and OpenCode agents on Android.
publish_to: none
version: 1.4.1+15

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.9.0
  xterm: ^4.0.0
  network_info_plus: ^8.2.2
  path_provider: ^2.1.4
  provider: ^6.1.1
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.3.6
  pointycastle: ^4.0.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  uuid: ^4.3.3
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  opencode_api: ^1.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^11.2.0
  home_widget:
    path: packages/home_widget
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  # Required by flutter_localizations via material_ui 1.x.
  intl: ^0.20.3
  # 1.4+ needs Dart ^3.13 / Flutter >=3.47 (this machine). 0.0.1 was a
  # re-export stub without MaterialUiCompatibilityBridge.
  material_ui: ^1.10.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0
  mockito: ^5.8.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - PRIVACY.md
    - assets/fonts/OFL.txt
    - assets/fonts/LICENSE
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceMono-Italic.ttf
          style: italic
        - asset: assets/fonts/SpaceMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.ttf
        - asset: assets/fonts/SourceCodePro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceCodePro-Italic.ttf
          style: italic
        - asset: assets/fonts/SourceCodePro-BoldItalic.ttf
          weight: 700
          style: italic
